<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan Produk V8 - Universal</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
  margin:0;
  background:#f3f5f7;
  font-family:Arial,sans-serif;
  padding:16px;
  color:#18222b
}

.card{
  max-width:900px;
  margin:auto;
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 28px #0001
}

h2{margin-top:0}

button,label{
  border:0;
  border-radius:11px;
  padding:12px 15px;
  background:#1769aa;
  color:white;
  font-weight:bold;
  cursor:pointer;
  display:inline-block;
  margin:4px
}

input{display:none}

#view,
#overlay,
#video{
  width:100%;
  max-height:560px;
  object-fit:contain;
  background:#111;
  border-radius:14px;
  margin-top:12px
}

#overlay{display:none}

#status{
  background:#eef3f7;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
  white-space:pre-wrap
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px
}

.box{
  background:#f5f7f9;
  border-radius:12px;
  padding:12px;
  text-align:center
}

.box small{
  display:block;
  color:#667
}

.box b{
  font-size:20px
}

.unit{
  border:1px solid #ddd;
  border-radius:9px;
  padding:9px;
  margin-top:7px
}

.ok{color:#146c38}
.warn{color:#946000}
.err{color:#a0182b}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div class="card">

<h2>📦 Scan Produk V8</h2>

<p>
Multi-product • OCR per unit • Universal Packaging
</p>

<button id="cam">📷 Kamera</button>

<label>
🖼️ Upload
<input id="file" type="file" accept="image/*">
</label>

<button id="stop">⏹ Stop</button>

<button id="scan">🔎 Scan</button>

<video
  id="video"
  autoplay
  playsinline
  style="display:none">
</video>

<img
  id="view"
  style="display:none">

<canvas id="overlay"></canvas>

<div id="status">
Memuat model...
</div>

<div class="grid">

<div class="box">
<small>PRODUK</small>
<b id="prod">-</b>
</div>

<div class="box">
<small>SIZE</small>
<b id="size">-</b>
</div>

<div class="box">
<small>JUMLAH</small>
<b id="count">0</b>
</div>

</div>

<div id="units"></div>

</div>

<script>

/*
==========================================================
V8 UNIVERSAL SAMPLE COUNTER
==========================================================

ALUR:

FOTO
 ↓
DETEKSI SETIAP UNIT
 ↓
CROP MASING-MASING UNIT
 ↓
OCR PER UNIT
 ↓
IDENTIFIKASI PRODUK
 ↓
JUMLAH UNIT

TARGET MODEL UNIVERSAL:

sample_product

Bukan:

bottle
tube
box
sachet

Karena semua bentuk kemasan dianggap satu unit produk.
==========================================================
*/


const CUSTOM_MODEL_URL="./model/model.json";


/*
==========================================================
PRODUCT MASTER
==========================================================
*/

const PRODUCTS=[

 {
   code:"P0008",

   name:"BETADINE MOUTHWASH AND GARGLE",

   size:"100 ML",

   aliases:[
     "BETADINE",
     "MOUTHWASH",
     "GARGLE",
     "POVIDONE IODINE",
     "POVIDONE"
   ]
 }

];


/*
==========================================================
VARIABLE
==========================================================
*/

let customModel=null;
let coco=null;
let stream=null;
let current=null;


/*
==========================================================
ELEMENT
==========================================================
*/

const video=
document.querySelector("#video");

const view=
document.querySelector("#view");

const canvas=
document.querySelector("#overlay");

const status=
document.querySelector("#status");


/*
==========================================================
STATUS
==========================================================
*/

function msg(text,cls=""){

  status.textContent=text;

  status.className=cls;

}


/*
==========================================================
NORMALIZE OCR
==========================================================
*/

function norm(text){

  return (text || "")
    .toUpperCase()
    .replace(/[^A-Z0-9 ]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/*
==========================================================
IDENTIFY PRODUCT
==========================================================
*/

function identify(text){

  const t=norm(text);

  let best=null;
  let score=0;

  for(const p of PRODUCTS){

    let s=0;

    if(t.includes(norm(p.name))){
      s=.95;
    }

    for(const alias of p.aliases){

      if(t.includes(norm(alias))){

        s=Math.max(
          s,
          .55 + Math.min(alias.length/100,.35)
        );

      }

    }

    if(s>score){

      score=s;
      best=p;

    }

  }

  return {
    product:best,
    score
  };

}


/*
==========================================================
SIZE
==========================================================
*/

function sizeOf(text,p){

  if(p?.size){
    return p.size;
  }

  const m=norm(text).match(
    /\b(\d+(?:[.,]\d+)?)\s*(ML|L|MG|G|KG|MCG|PCS|TAB|TABLET)\b/
  );

  return m
    ? m[1]+" "+m[2]
    : "-";

}


/*
==========================================================
IOU
==========================================================
*/

function iou(a,b){

  const x=Math.max(
    0,
    Math.min(
      a[0]+a[2],
      b[0]+b[2]
    )
    -
    Math.max(a[0],b[0])
  );

  const y=Math.max(
    0,
    Math.min(
      a[1]+a[3],
      b[1]+b[3]
    )
    -
    Math.max(a[1],b[1])
  );

  const inter=x*y;

  const areaA=a[2]*a[3];

  const areaB=b[2]*b[3];

  const union=
    areaA+
    areaB-
    inter;

  return inter/
    Math.max(1,union);

}


/*
==========================================================
REMOVE DUPLICATE BOX
==========================================================
*/

function dedupe(ds){

  ds.sort(
    (a,b)=>b.score-a.score
  );

  const out=[];

  for(const d of ds){

    if(
      !out.some(
        x=>iou(x.bbox,d.bbox)>.5
      )
    ){

      out.push(d);

    }

  }

  return out;

}


/*
==========================================================
CUSTOM UNIVERSAL MODEL
==========================================================

Model universal harus mendeteksi:

sample_product

Format internal:

{
 bbox:[x,y,width,height],
 score:0.0-1.0,
 class:"sample_product"
}

FORMAT OUTPUT MODEL TRAINING BERBEDA-BEDA.

Jadi fungsi ini nanti disesuaikan dengan model
yang digunakan.
==========================================================
*/

async function detectCustom(img){

  /*
  ========================================================
  BAGIAN INI AKAN DIISI SESUAI MODEL UNIVERSAL.

  Jangan dipaksa memakai output COCO-SSD.

  Kalau model YOLO/TensorFlow.js sudah tersedia,
  adapter-nya bisa dibuat khusus.
  ========================================================
  */

  throw new Error(
    "CUSTOM_MODEL_ADAPTER_NOT_CONFIGURED"
  );

}


/*
==========================================================
COCO FALLBACK
==========================================================

HANYA FALLBACK.

COCO-SSD TIDAK DIANGGAP UNIVERSAL.

Untuk sementara hanya bottle.
==========================================================
*/

async function detectFallback(img){

  if(!coco){
    return [];
  }

  const predictions=
    await coco.detect(
      img,
      50,
      .20
    );

  return predictions

    .filter(
      x=>x.class==="bottle"
    )

    .map(x=>({

      bbox:x.bbox,

      score:x.score,

      class:"sample_product"

    }));

}


/*
==========================================================
SOURCE IMAGE
==========================================================
*/

function source(){

  if(
    stream &&
    video.videoWidth
  ){

    canvas.width=
      video.videoWidth;

    canvas.height=
      video.videoHeight;

    canvas
      .getContext("2d")
      .drawImage(
        video,
        0,
        0
      );

    return canvas;

  }

  if(current){

    return current;

  }

  throw new Error(
    "Belum ada foto"
  );

}


/*
==========================================================
CROP PER UNIT
==========================================================
*/

function crop(
  img,
  bbox,
  padding=.08
){

  const [
    x,
    y,
    w,
    h
  ]=bbox;


  const W=
    img.naturalWidth ||
    img.videoWidth ||
    img.width;


  const H=
    img.naturalHeight ||
    img.videoHeight ||
    img.height;


  const x1=
    Math.max(
      0,
      x-w*padding
    );


  const y1=
    Math.max(
      0,
      y-h*padding
    );


  const x2=
    Math.min(
      W,
      x+w+w*padding
    );


  const y2=
    Math.min(
      H,
      y+h+h*padding
    );


  const c=
    document.createElement(
      "canvas"
    );


  c.width=
    x2-x1;

  c.height=
    y2-y1;


  c.getContext("2d")
    .drawImage(
      img,
      x1,
      y1,
      c.width,
      c.height,
      0,
      0,
      c.width,
      c.height
    );


  return c;

}


/*
==========================================================
DRAW DETECTIONS
==========================================================
*/

function draw(img,ds){

  canvas.width=
    img.naturalWidth ||
    img.videoWidth ||
    img.width;

  canvas.height=
    img.naturalHeight ||
    img.videoHeight ||
    img.height;


  const c=
    canvas.getContext("2d");


  c.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );


  c.strokeStyle=
    "#00ff66";

  c.fillStyle=
    "#00ff66";

  c.lineWidth=4;

  c.font=
    "bold 22px Arial";


  ds.forEach(
    (d,i)=>{

      const [
        x,
        y,
        w,
        h
      ]=d.bbox;


      c.strokeRect(
        x,
        y,
        w,
        h
      );


      c.fillText(
        (i+1)+
        " "+
        Math.round(
          d.score*100
        )+
        "%",
        x+5,
        Math.max(
          24,
          y+24
        )
      );

    }
  );


  canvas.style.display=
    "block";

  view.style.display=
    "none";

}


/*
==========================================================
OCR
==========================================================
*/

async function ocr(c){

  const result=
    await Tesseract.recognize(
      c,
      "eng",
      {

        logger:x=>{

          if(
            x.status===
            "recognizing text"
          ){

            msg(
              "OCR unit... "+
              Math.round(
                (x.progress||0)*100
              )+
              "%"
            );

          }

        }

      }
    );


  return result.data.text || "";

}


/*
==========================================================
CAMERA
==========================================================
*/

document.querySelector(
  "#cam"
).onclick=async()=>{

  try{

    stream=
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            }
          },

          audio:false

        });


    video.srcObject=
      stream;

    video.style.display=
      "block";

    view.style.display=
      "none";


    msg(
      "Kamera aktif.\n"+
      "Arahkan ke semua produk lalu tekan Scan."
    );


  }catch(e){

    msg(
      "Kamera gagal: "+
      e.message,
      "err"
    );

  }

};


/*
==========================================================
STOP CAMERA
==========================================================
*/

document.querySelector(
  "#stop"
).onclick=()=>{

  if(stream){

    stream
      .getTracks()
      .forEach(
        t=>t.stop()
      );

    stream=null;

  }

  video.style.display=
    "none";

};


/*
==========================================================
UPLOAD
==========================================================
*/

document.querySelector(
  "#file"
).onchange=e=>{

  const file=
    e.target.files[0];

  if(!file){
    return;
  }


  const url=
    URL.createObjectURL(file);


  view.onload=()=>{

    current=view;

    view.style.display=
      "block";

    video.style.display=
      "none";


    msg(
      "Foto siap.\n"+
      "Tekan Scan."
    );

  };


  view.src=url;

};


/*
==========================================================
SCAN
==========================================================
*/

document.querySelector(
  "#scan"
).onclick=async()=>{

  try{

    document.querySelector(
      "#units"
    ).innerHTML="";


    document.querySelector(
      "#prod"
    ).textContent="-";


    document.querySelector(
      "#size"
    ).textContent="-";


    document.querySelector(
      "#count"
    ).textContent="0";


    const img=
      source();


    msg(
      "Mendeteksi setiap unit..."
    );


    let detections=[];


    /*
    ======================================================
    PRIORITAS MODEL UNIVERSAL
    ======================================================
    */

    if(customModel){

      try{

        detections=
          await detectCustom(img);

      }catch(e){

        console.error(e);

        msg(
          "Model universal sudah ada,\n"+
          "tetapi adapter output model belum disesuaikan.\n\n"+
          "Kirim model hasil training agar bagian detector "+
          "bisa saya sesuaikan.",
          "warn"
        );

        return;

      }


    }else{

      /*
      ====================================================
      FALLBACK
      ====================================================
      */

      detections=
        await detectFallback(img);

    }


    detections=
      dedupe(detections);


    /*
    ======================================================
    NO DETECTION
    ======================================================
    */

    if(!detections.length){

      msg(
        "Tidak ada unit terdeteksi.\n\n"+
        "Untuk kemasan universal diperlukan "+
        "model sample_product.",
        "warn"
      );

      return;

    }


    /*
    ======================================================
    DRAW BOX
    ======================================================
    */

    draw(
      img,
      detections
    );


    /*
    ======================================================
    COUNT
    ======================================================
    */

    document.querySelector(
      "#count"
    ).textContent=
      detections.length;


    /*
    ======================================================
    OCR EACH UNIT
    ======================================================
    */

    let allText="";


    for(
      let i=0;
      i<detections.length;
      i++
    ){

      const unitCrop=
        crop(
          img,
          detections[i].bbox
        );


      const text=
        await ocr(
          unitCrop
        );


      allText+=
        "\n"+
        text;


      const div=
        document.createElement(
          "div"
        );


      div.className=
        "unit";


      div.innerHTML=
        "<b>Unit "+
        (i+1)+
        "</b><br>"+
        (
          norm(text) ||
          "(OCR tidak terbaca)"
        );


      document.querySelector(
        "#units"
      ).appendChild(div);

    }


    /*
    ======================================================
    IDENTIFY PRODUCT
    ======================================================
    */

    const result=
      identify(
        allText
      );


    if(result.product){

      document.querySelector(
        "#prod"
      ).textContent=
        result.product.name;


      document.querySelector(
        "#size"
      ).textContent=
        sizeOf(
          allText,
          result.product
        );


      msg(

        "SELESAI\n\n"+
        "Produk: "+
        result.product.name+
        "\n"+
        "Size: "+
        sizeOf(
          allText,
          result.product
        )+
        "\n"+
        "Jumlah: "+
        detections.length+
        " unit",

        "ok"

      );


    }else{

      document.querySelector(
        "#size"
      ).textContent=
        sizeOf(
          allText,
          null
        );


      msg(

        "Jumlah: "+
        detections.length+
        " unit.\n"+
        "OCR selesai tetapi produk belum ada "+
        "di Product Master.",

        "warn"

      );

    }


  }catch(e){

    console.error(e);

    msg(
      "Scan gagal: "+
      e.message,
      "err"
    );

  }

};


/*
==========================================================
LOAD MODELS
==========================================================
*/

(async()=>{

  await tf.ready();


  /*
  ========================================================
  COCO FALLBACK
  ========================================================
  */

  try{

    coco=
      await cocoSsd.load({
        base:"lite_mobilenet_v2"
      });

  }catch(e){

    console.warn(
      "COCO gagal:",
      e
    );

  }


  /*
  ========================================================
  CUSTOM UNIVERSAL MODEL
  ========================================================
  */

  try{

    customModel=
      await tf.loadGraphModel(
        CUSTOM_MODEL_URL
      );


    msg(

      "Model universal ditemukan.\n"+
      "Adapter output perlu disesuaikan "+
      "dengan format model.",

      "warn"

    );


  }catch(e){

    msg(

      "Sistem siap.\n\n"+
      "Belum ada model universal.\n"+
      "Mode sementara hanya mengenali bottle.\n\n"+
      "Target model final:\n"+
      "sample_product",

      "warn"

    );

  }

})();

</script>

</body>
</html>
