<script>

/*
==========================================================
SCAN PRODUK V8
UNIVERSAL SAMPLE PRODUCT
==========================================================

ALUR:

FOTO
 ↓
YOLO26 ONNX
 ↓
DETEKSI sample_product
 ↓
CROP PER UNIT
 ↓
OCR
 ↓
IDENTIFIKASI PRODUK
 ↓
JUMLAH

Model:
sample_product.onnx

Output:
(1, 300, 6)

Format:
[x1, y1, x2, y2, confidence, class]

==========================================================
*/


/*
==========================================================
MODEL
==========================================================
*/

const CUSTOM_MODEL_URL =
  "./model/sample_product.onnx";


const MODEL_SIZE =
  640;


const CONF_THRESHOLD =
  0.35;


/*
==========================================================
PRODUCT MASTER
==========================================================
*/

const PRODUCTS = [

  {
    code:"P0008",

    name:"BETADINE MOUTHWASH AND GARGLE",

    size:"100 ML",

    aliases:[
      "BETADINE",
      "MOUTHWASH",
      "GARGLE",
      "POVIDONE IODINE",
      "POVIDONE"
    ]

  }

];


/*
==========================================================
VARIABLE
==========================================================
*/

let customModel = null;

let stream = null;

let current = null;


/*
==========================================================
ELEMENT
==========================================================
*/

const video =
  document.querySelector("#video");


const view =
  document.querySelector("#view");


const canvas =
  document.querySelector("#overlay");


const status =
  document.querySelector("#status");


/*
==========================================================
STATUS
==========================================================
*/

function msg(
  text,
  cls=""
){

  status.textContent =
    text;

  status.className =
    cls;

}


/*
==========================================================
NORMALIZE
==========================================================
*/

function norm(text){

  return (
    text || ""
  )
  .toUpperCase()
  .replace(
    /[^A-Z0-9 ]/g,
    " "
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


/*
==========================================================
IDENTIFY PRODUCT
==========================================================
*/

function identify(text){

  const t =
    norm(text);


  let best = null;

  let score = 0;


  for(
    const p of PRODUCTS
  ){

    let s = 0;


    if(
      t.includes(
        norm(p.name)
      )
    ){

      s = .95;

    }


    for(
      const alias of p.aliases
    ){

      if(
        t.includes(
          norm(alias)
        )
      ){

        s =
          Math.max(
            s,
            .55 +
            Math.min(
              alias.length / 100,
              .35
            )
          );

      }

    }


    if(
      s > score
    ){

      score = s;

      best = p;

    }

  }


  return {
    product:best,
    score
  };

}


/*
==========================================================
SIZE
==========================================================
*/

function sizeOf(
  text,
  p
){

  if(
    p?.size
  ){

    return p.size;

  }


  const m =
    norm(text).match(
      /\b(\d+(?:[.,]\d+)?)\s*(ML|L|MG|G|KG|MCG|PCS|TAB|TABLET)\b/
    );


  return m
    ? m[1]+" "+m[2]
    : "-";

}


/*
==========================================================
IOU
==========================================================
*/

function iou(
  a,
  b
){

  const x =
    Math.max(
      0,
      Math.min(
        a[0]+a[2],
        b[0]+b[2]
      )
      -
      Math.max(
        a[0],
        b[0]
      )
    );


  const y =
    Math.max(
      0,
      Math.min(
        a[1]+a[3],
        b[1]+b[3]
      )
      -
      Math.max(
        a[1],
        b[1]
      )
    );


  const inter =
    x*y;


  const areaA =
    a[2]*a[3];


  const areaB =
    b[2]*b[3];


  const union =
    areaA +
    areaB -
    inter;


  return (
    inter /
    Math.max(
      1,
      union
    )
  );

}


/*
==========================================================
DEDUPE
==========================================================
*/

function dedupe(
  ds
){

  ds.sort(
    (a,b)=>
      b.score -
      a.score
  );


  const out = [];


  for(
    const d of ds
  ){

    if(
      !out.some(
        x =>
          iou(
            x.bbox,
            d.bbox
          ) > .5
      )
    ){

      out.push(d);

    }

  }


  return out;

}


/*
==========================================================
DETECT CUSTOM ONNX
==========================================================
*/

async function detectCustom(
  img
){

  if(
    !customModel
  ){

    throw new Error(
      "MODEL_NOT_LOADED"
    );

  }


  /*
  --------------------------------------------------------
  ORIGINAL IMAGE
  --------------------------------------------------------
  */

  const W =
    img.naturalWidth ||
    img.videoWidth ||
    img.width;


  const H =
    img.naturalHeight ||
    img.videoHeight ||
    img.height;


  if(
    !W ||
    !H
  ){

    throw new Error(
      "IMAGE_SIZE_INVALID"
    );

  }


  /*
  --------------------------------------------------------
  LETTERBOX SCALE
  --------------------------------------------------------
  */

  const scale =
    Math.min(
      MODEL_SIZE / W,
      MODEL_SIZE / H
    );


  const newW =
    Math.round(
      W * scale
    );


  const newH =
    Math.round(
      H * scale
    );


  const padX =
    (MODEL_SIZE - newW) / 2;


  const padY =
    (MODEL_SIZE - newH) / 2;


  /*
  --------------------------------------------------------
  TEMP CANVAS
  --------------------------------------------------------
  */

  const c =
    document.createElement(
      "canvas"
    );


  c.width =
    MODEL_SIZE;


  c.height =
    MODEL_SIZE;


  const ctx =
    c.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  /*
  --------------------------------------------------------
  YOLO LETTERBOX COLOR
  --------------------------------------------------------
  */

  ctx.fillStyle =
    "rgb(114,114,114)";


  ctx.fillRect(
    0,
    0,
    MODEL_SIZE,
    MODEL_SIZE
  );


  /*
  --------------------------------------------------------
  DRAW IMAGE
  --------------------------------------------------------
  */

  ctx.drawImage(
    img,
    0,
    0,
    W,
    H,
    padX,
    padY,
    newW,
    newH
  );


  /*
  --------------------------------------------------------
  PIXELS
  --------------------------------------------------------
  */

  const pixels =
    ctx.getImageData(
      0,
      0,
      MODEL_SIZE,
      MODEL_SIZE
    ).data;


  const area =
    MODEL_SIZE *
    MODEL_SIZE;


  const input =
    new Float32Array(
      3 * area
    );


  /*
  --------------------------------------------------------
  RGB HWC -> CHW
  --------------------------------------------------------
  */

  for(
    let i=0;
    i<area;
    i++
  ){

    input[i] =
      pixels[i*4] /
      255;


    input[area+i] =
      pixels[i*4+1] /
      255;


    input[2*area+i] =
      pixels[i*4+2] /
      255;

  }


  /*
  --------------------------------------------------------
  INPUT TENSOR
  --------------------------------------------------------
  */

  const inputName =
    customModel.inputNames[0];


  const inputTensor =
    new ort.Tensor(
      "float32",
      input,
      [
        1,
        3,
        MODEL_SIZE,
        MODEL_SIZE
      ]
    );


  /*
  --------------------------------------------------------
  RUN ONNX
  --------------------------------------------------------
  */

  const outputs =
    await customModel.run({

      [inputName]:
        inputTensor

    });


  const outputName =
    customModel.outputNames[0];


  const output =
    outputs[
      outputName
    ];


  const data =
    output.data;


  const dims =
    output.dims;


  console.log(
    "ONNX OUTPUT SHAPE:",
    dims
  );


  /*
  --------------------------------------------------------
  CHECK OUTPUT
  --------------------------------------------------------
  */

  if(
    !dims ||
    dims.length !== 3 ||
    dims[0] !== 1 ||
    dims[2] !== 6
  ){

    throw new Error(
      "OUTPUT_SHAPE_TIDAK_DIDUKUNG: " +
      JSON.stringify(dims)
    );

  }


  /*
  --------------------------------------------------------
  DECODE
  --------------------------------------------------------
  */

  const detections = [];


  for(
    let i=0;
    i<dims[1];
    i++
  ){

    const o =
      i * 6;


    const x1 =
      data[o];


    const y1 =
      data[o+1];


    const x2 =
      data[o+2];


    const y2 =
      data[o+3];


    const score =
      data[o+4];


    const cls =
      data[o+5];


    /*
    ------------------------------------------------------
    CONFIDENCE
    ------------------------------------------------------
    */

    if(
      !Number.isFinite(score) ||
      score < CONF_THRESHOLD
    ){

      continue;

    }


    /*
    ------------------------------------------------------
    ONLY CLASS 0
    ------------------------------------------------------
    */

    if(
      cls !== 0 &&
      cls !== 0.0
    ){

      continue;

    }


    /*
    ------------------------------------------------------
    CONVERT LETTERBOX -> ORIGINAL
    ------------------------------------------------------
    */

    const bx1 =
      Math.max(
        0,
        (x1 - padX) /
        scale
      );


    const by1 =
      Math.max(
        0,
        (y1 - padY) /
        scale
      );


    const bx2 =
      Math.min(
        W,
        (x2 - padX) /
        scale
      );


    const by2 =
      Math.min(
        H,
        (y2 - padY) /
        scale
      );


    const bw =
      bx2 - bx1;


    const bh =
      by2 - by1;


    if(
      bw <= 2 ||
      bh <= 2
    ){

      continue;

    }


    detections.push({

      bbox:[
        bx1,
        by1,
        bw,
        bh
      ],

      score:

        score,

      class:
        "sample_product"

    });

  }


  return detections;

}


/*
==========================================================
SOURCE IMAGE
==========================================================
*/

function source(){

  if(
    stream &&
    video.videoWidth
  ){

    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    canvas
      .getContext("2d")
      .drawImage(
        video,
        0,
        0
      );


    return canvas;

  }


  if(
    current
  ){

    return current;

  }


  throw new Error(
    "Belum ada foto"
  );

}


/*
==========================================================
CROP UNIT
==========================================================
*/

function crop(
  img,
  bbox,
  padding=.08
){

  const [
    x,
    y,
    w,
    h
  ] = bbox;


  const W =
    img.naturalWidth ||
    img.videoWidth ||
    img.width;


  const H =
    img.naturalHeight ||
    img.videoHeight ||
    img.height;


  const x1 =
    Math.max(
      0,
      x - w*padding
    );


  const y1 =
    Math.max(
      0,
      y - h*padding
    );


  const x2 =
    Math.min(
      W,
      x+w+w*padding
    );


  const y2 =
    Math.min(
      H,
      y+h+h*padding
    );


  const c =
    document.createElement(
      "canvas"
    );


  c.width =
    Math.max(
      1,
      x2-x1
    );


  c.height =
    Math.max(
      1,
      y2-y1
    );


  c.getContext("2d")
    .drawImage(
      img,
      x1,
      y1,
      c.width,
      c.height,
      0,
      0,
      c.width,
      c.height
    );


  return c;

}


/*
==========================================================
DRAW
==========================================================
*/

function draw(
  img,
  ds
){

  canvas.width =
    img.naturalWidth ||
    img.videoWidth ||
    img.width;


  canvas.height =
    img.naturalHeight ||
    img.videoHeight ||
    img.height;


  const c =
    canvas.getContext(
      "2d"
    );


  c.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );


  c.strokeStyle =
    "#00ff66";


  c.fillStyle =
    "#00ff66";


  c.lineWidth =
    4;


  c.font =
    "bold 22px Arial";


  ds.forEach(
    (d,i)=>{

      const [
        x,
        y,
        w,
        h
      ] = d.bbox;


      c.strokeRect(
        x,
        y,
        w,
        h
      );


      c.fillText(
        (i+1) +
        " " +
        Math.round(
          d.score*100
        ) +
        "%",
        x+5,
        Math.max(
          24,
          y+24
        )
      );

    }
  );


  canvas.style.display =
    "block";


  view.style.display =
    "none";

}


/*
==========================================================
OCR
==========================================================
*/

async function ocr(
  c
){

  const result =
    await Tesseract.recognize(
      c,
      "eng",
      {

        logger:x=>{

          if(
            x.status ===
            "recognizing text"
          ){

            msg(
              "OCR unit... " +
              Math.round(
                (x.progress || 0) *
                100
              ) +
              "%"
            );

          }

        }

      }
    );


  return (
    result.data.text ||
    ""
  );

}


/*
==========================================================
CAMERA
==========================================================
*/

document.querySelector(
  "#cam"
).onclick = async()=>{

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    video.srcObject =
      stream;


    video.style.display =
      "block";


    view.style.display =
      "none";


    msg(
      "Kamera aktif.\n" +
      "Arahkan ke semua produk lalu tekan Scan."
    );


  }catch(e){

    console.error(e);


    msg(
      "Kamera gagal: " +
      e.message,
      "err"
    );

  }

};


/*
==========================================================
STOP CAMERA
==========================================================
*/

document.querySelector(
  "#stop"
).onclick = ()=>{

  if(
    stream
  ){

    stream
      .getTracks()
      .forEach(
        t =>
          t.stop()
      );


    stream = null;

  }


  video.style.display =
    "none";

};


/*
==========================================================
UPLOAD
==========================================================
*/

document.querySelector(
  "#file"
).onchange = e=>{

  const file =
    e.target.files[0];


  if(
    !file
  ){

    return;

  }


  const url =
    URL.createObjectURL(
      file
    );


  view.onload = ()=>{

    current =
      view;


    view.style.display =
      "block";


    video.style.display =
      "none";


    msg(
      "Foto siap.\n" +
      "Tekan Scan."
    );

  };


  view.src =
    url;

};


/*
==========================================================
SCAN
==========================================================
*/

document.querySelector(
  "#scan"
).onclick = async()=>{

  try{

    document.querySelector(
      "#units"
    ).innerHTML = "";


    document.querySelector(
      "#prod"
    ).textContent =
      "-";


    document.querySelector(
      "#size"
    ).textContent =
      "-";


    document.querySelector(
      "#count"
    ).textContent =
      "0";


    const img =
      source();


    if(
      !customModel
    ){

      throw new Error(
        "Model universal belum dimuat."
      );

    }


    msg(
      "Mendeteksi setiap unit..."
    );


    /*
    ======================================================
    DETECTION
    ======================================================
    */

    let detections =
      await detectCustom(
        img
      );


    /*
    ======================================================
    DEDUPE
    ======================================================
    */

    detections =
      dedupe(
        detections
      );


    /*
    ======================================================
    NO DETECTION
    ======================================================
    */

    if(
      !detections.length
    ){

      msg(

        "Tidak ada unit terdeteksi.\n\n" +
        "Coba:\n" +
        "• Dekatkan produk\n" +
        "• Pastikan pencahayaan cukup\n" +
        "• Pastikan seluruh produk terlihat",

        "warn"

      );

      return;

    }


    /*
    ======================================================
    DRAW
    ======================================================
    */

    draw(
      img,
      detections
    );


    /*
    ======================================================
    COUNT
    ======================================================
    */

    document.querySelector(
      "#count"
    ).textContent =
      detections.length;


    /*
    ======================================================
    OCR
    ======================================================
    */

    let allText =
      "";


    for(
      let i=0;
      i<detections.length;
      i++
    ){

      const unitCrop =
        crop(
          img,
          detections[i].bbox
        );


      const text =
        await ocr(
          unitCrop
        );


      allText +=
        "\n" +
        text;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "unit";


      div.innerHTML =
        "<b>Unit " +
        (i+1) +
        "</b><br>" +
        (
          norm(text) ||
          "(OCR tidak terbaca)"
        );


      document.querySelector(
        "#units"
      ).appendChild(
        div
      );

    }


    /*
    ======================================================
    PRODUCT IDENTIFICATION
    ======================================================
    */

    const result =
      identify(
        allText
      );


    if(
      result.product
    ){

      document.querySelector(
        "#prod"
      ).textContent =
        result.product.name;


      document.querySelector(
        "#size"
      ).textContent =
        sizeOf(
          allText,
          result.product
        );


      msg(

        "SELESAI\n\n" +
        "Produk: " +
        result.product.name +
        "\n" +
        "Size: " +
        sizeOf(
          allText,
          result.product
        ) +
        "\n" +
        "Jumlah: " +
        detections.length +
        " unit",

        "ok"

      );

    }else{

      document.querySelector(
        "#size"
      ).textContent =
        sizeOf(
          allText,
          null
        );


      msg(

        "Jumlah: " +
        detections.length +
        " unit.\n" +
        "OCR selesai tetapi produk belum ada " +
        "di Product Master.",

        "warn"

      );

    }


  }catch(e){

    console.error(
      "SCAN ERROR:",
      e
    );


    msg(

      "Scan gagal: " +
      e.message,

      "err"

    );

  }

};


/*
==========================================================
LOAD ONNX MODEL
==========================================================
*/

(async()=>{

  try{

    /*
    ------------------------------------------------------
    CHECK ORT
    ------------------------------------------------------
    */

    if(
      !window.ort
    ){

      throw new Error(
        "ONNX Runtime Web tidak termuat."
      );

    }


    /*
    ------------------------------------------------------
    WASM CONFIG
    ------------------------------------------------------
    */

    ort.env.wasm.numThreads =
      1;


    ort.env.wasm.simd =
      true;


    /*
    ------------------------------------------------------
    PENTING:
    ARAHKAN WASM KE CDN
    ------------------------------------------------------
    */

    ort.env.wasm.wasmPaths =
      "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";


    /*
    ------------------------------------------------------
    STATUS
    ------------------------------------------------------
    */

    msg(
      "Memuat model universal ONNX..."
    );


    /*
    ------------------------------------------------------
    LOAD MODEL
    ------------------------------------------------------
    */

    customModel =
      await ort.InferenceSession.create(
        CUSTOM_MODEL_URL,
        {

          executionProviders:[
            "wasm"
          ],

          graphOptimizationLevel:
            "all"

        }
      );


    /*
    ------------------------------------------------------
    DEBUG INFO
