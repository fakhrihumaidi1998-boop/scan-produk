<script>

/*
==========================================================
SCAN PRODUK V9
UNIVERSAL SAMPLE PRODUCT
==========================================================

MODEL:
sample_product.onnx

INPUT:
1 x 3 x 640 x 640

OUTPUT:
1 x 300 x 6

FORMAT:
[x1, y1, x2, y2, confidence, class]

CLASS:
0 = sample_product
==========================================================
*/


/*
==========================================================
MODEL CONFIG
==========================================================
*/

const CUSTOM_MODEL_URL =
  "./model/sample_product.onnx";

const MODEL_SIZE =
  640;

const CONF_THRESHOLD =
  0.35;


/*
==========================================================
PRODUCT MASTER
==========================================================
*/

const PRODUCTS = [

  {
    code:"P0008",

    name:"BETADINE MOUTHWASH AND GARGLE",

    size:"100 ML",

    aliases:[
      "BETADINE",
      "BETADIN",
      "MOUTHWASH",
      "MOUTWASH",
      "GARGLE",
      "GARGIE",
      "POVIDONE IODINE",
      "POVIDONE"
    ]
  }

];


/*
==========================================================
VARIABLE
==========================================================
*/

let customModel = null;

let stream = null;

let current = null;


/*
==========================================================
ELEMENT
==========================================================
*/

const video =
  document.querySelector("#video");

const view =
  document.querySelector("#view");

const canvas =
  document.querySelector("#overlay");

const status =
  document.querySelector("#status");


/*
==========================================================
STATUS
==========================================================
*/

function msg(
  text,
  cls=""
){

  status.textContent =
    text;

  status.className =
    cls;

}


/*
==========================================================
NORMALIZE OCR
==========================================================
*/

function norm(text){

  return (
    text || ""
  )
  .toUpperCase()
  .replace(
    /[^A-Z0-9 ]/g,
    " "
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


/*
==========================================================
LEVENSHTEIN
==========================================================
*/

function levenshtein(a,b){

  const m =
    a.length;

  const n =
    b.length;

  const dp =
    Array.from(
      {length:m+1},
      () =>
        new Array(n+1).fill(0)
    );


  for(
    let i=0;
    i<=m;
    i++
  ){

    dp[i][0] =
      i;

  }


  for(
    let j=0;
    j<=n;
    j++
  ){

    dp[0][j] =
      j;

  }


  for(
    let i=1;
    i<=m;
    i++
  ){

    for(
      let j=1;
      j<=n;
      j++
    ){

      const cost =
        a[i-1] === b[j-1]
        ? 0
        : 1;


      dp[i][j] =
        Math.min(

          dp[i-1][j]+1,

          dp[i][j-1]+1,

          dp[i-1][j-1]+cost

        );

    }

  }


  return dp[m][n];

}


/*
==========================================================
SIMILARITY
==========================================================
*/

function similarity(a,b){

  a =
    norm(a);

  b =
    norm(b);


  if(
    !a ||
    !b
  ){

    return 0;

  }


  if(
    a === b
  ){

    return 1;

  }


  if(
    a.includes(b) ||
    b.includes(a)
  ){

    return 0.9;

  }


  const d =
    levenshtein(
      a,
      b
    );


  return Math.max(
    0,
    1 -
    d /
    Math.max(
      a.length,
      b.length
    )
  );

}


/*
==========================================================
IDENTIFY PRODUCT
==========================================================
*/

function identify(text){

  const t =
    norm(text);


  let best =
    null;

  let bestScore =
    0;


  for(
    const p of PRODUCTS
  ){

    let score =
      0;


    /*
    --------------------------------------------
    NAMA PRODUK
    --------------------------------------------
    */

    score =
      Math.max(
        score,
        similarity(
          t,
          p.name
        )
      );


    /*
    --------------------------------------------
    ALIAS
    --------------------------------------------
    */

    for(
      const alias of p.aliases
    ){

      const a =
        norm(alias);


      if(
        t.includes(a)
      ){

        score =
          Math.max(
            score,
            0.75
          );

        continue;

      }


      const words =
        t.split(
          /\s+/
        );


      for(
        const word of words
      ){

        if(
          word.length < 4 ||
          a.length < 4
        ){

          continue;

        }


        const s =
          similarity(
            word,
            a
          );


        if(
          s >= 0.72
        ){

          score =
            Math.max(
              score,
              0.72
            );

        }

      }

    }


    /*
    --------------------------------------------
    MATCH KATA PENTING
    --------------------------------------------
    */

    const importantWords =
      p.name
      .split(/\s+/)
      .filter(
        x =>
          x.length >= 4
      );


    let matched =
      0;


    const ocrWords =
      t.split(
        /\s+/
      );


    for(
      const word of importantWords
    ){

      if(
        t.includes(word)
      ){

        matched++;

        continue;

      }


      if(
        ocrWords.some(
          ow =>
            similarity(
              ow,
              word
            ) >= 0.72
        )
      ){

        matched++;

      }

    }


    if(
      importantWords.length
    ){

      const wordScore =
        matched /
        importantWords.length;


      score =
        Math.max(
          score,
          wordScore * 0.9
        );

    }


    console.log(
      "PRODUCT CANDIDATE:",
      p.name,
      score
    );


    if(
      score >
      bestScore
    ){

      bestScore =
        score;

      best =
        p;

    }

  }


  console.log(
    "PRODUCT MATCH:",
    {
      text:t,
      product:
        best?.name,
      score:
        bestScore
    }
  );


  /*
  --------------------------------------------
  MINIMUM SCORE
  --------------------------------------------
  */

  if(
    bestScore < 0.45
  ){

    best =
      null;

  }


  return {
    product:best,
    score:bestScore
  };

}


/*
==========================================================
SIZE
==========================================================
*/

function sizeOf(
  text,
  p
){

  if(
    p?.size
  ){

    return p.size;

  }


  const m =
    norm(text).match(
      /\b(\d+(?:[.,]\d+)?)\s*(ML|L|MG|G|KG|MCG|PCS|TAB|TABLET)\b/
    );


  return m
    ? m[1]+" "+m[2]
    : "-";

}


/*
==========================================================
IOU
==========================================================
*/

function iou(
  a,
  b
){

  const x =
    Math.max(
      0,
      Math.min(
        a[0]+a[2],
        b[0]+b[2]
      )
      -
      Math.max(
        a[0],
        b[0]
      )
    );


  const y =
    Math.max(
      0,
      Math.min(
        a[1]+a[3],
        b[1]+b[3]
      )
      -
      Math.max(
        a[1],
        b[1]
      )
    );


  const inter =
    x*y;


  const areaA =
    a[2]*a[3];


  const areaB =
    b[2]*b[3];


  const union =
    areaA+
    areaB-
    inter;


  return (
    inter /
    Math.max(
      1,
      union
    )
  );

}


/*
==========================================================
REMOVE DUPLICATE BOX
==========================================================
*/

function dedupe(
  ds
){

  ds.sort(
    (a,b)=>
      b.score-a.score
  );


  const out =
    [];


  for(
    const d of ds
  ){

    if(
      !out.some(
        x =>
          iou(
            x.bbox,
            d.bbox
          ) > 0.5
      )
    ){

      out.push(d);

    }

  }


  return out;

}


/*
==========================================================
DETECT WITH ONNX
==========================================================
*/

async function detectCustom(
  img
){

  if(
    !customModel
  ){

    throw new Error(
      "MODEL_NOT_LOADED"
    );

  }


  const W =
    img.naturalWidth ||
    img.videoWidth ||
    img.width;


  const H =
    img.naturalHeight ||
    img.videoHeight ||
    img.height;


  if(
    !W ||
    !H
  ){

    throw new Error(
      "IMAGE_SIZE_INVALID"
    );

  }


  /*
  --------------------------------------------------------
  LETTERBOX
  --------------------------------------------------------
  */

  const scale =
    Math.min(
      MODEL_SIZE / W,
      MODEL_SIZE / H
    );


  const newW =
    Math.round(
      W * scale
    );


  const newH =
    Math.round(
      H * scale
    );


  const padX =
    (MODEL_SIZE-newW)/2;


  const padY =
    (MODEL_SIZE-newH)/2;


  /*
  --------------------------------------------------------
  CANVAS
  --------------------------------------------------------
  */

  const c =
    document.createElement(
      "canvas"
    );


  c.width =
    MODEL_SIZE;

  c.height =
    MODEL_SIZE;


  const ctx =
    c.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.fillStyle =
    "rgb(114,114,114)";


  ctx.fillRect(
    0,
    0,
    MODEL_SIZE,
    MODEL_SIZE
  );


  ctx.drawImage(
    img,
    0,
    0,
    W,
    H,
    padX,
    padY,
    newW,
    newH
  );


  /*
  --------------------------------------------------------
  PIXELS
  --------------------------------------------------------
  */

  const pixels =
    ctx.getImageData(
      0,
      0,
      MODEL_SIZE,
      MODEL_SIZE
    ).data;


  const area =
    MODEL_SIZE *
    MODEL_SIZE;


  const input =
    new Float32Array(
      3*area
    );


  for(
    let i=0;
    i<area;
    i++
  ){

    input[i] =
      pixels[i*4]/255;


    input[area+i] =
      pixels[i*4+1]/255;


    input[2*area+i] =
      pixels[i*4+2]/255;

  }


  /*
  --------------------------------------------------------
  INPUT
  --------------------------------------------------------
  */

  const inputName =
    customModel.inputNames[0];


  const inputTensor =
    new ort.Tensor(
      "float32",
      input,
      [
        1,
        3,
        MODEL_SIZE,
        MODEL_SIZE
      ]
    );


  /*
  --------------------------------------------------------
  INFERENCE
  --------------------------------------------------------
  */

  const outputs =
    await customModel.run({

      [inputName]:
        inputTensor

    });


  const outputName =
    customModel.outputNames[0];


  const output =
    outputs[
      outputName
    ];


  const data =
    output.data;


  const dims =
    output.dims;


  console.log(
    "ONNX OUTPUT SHAPE:",
    dims
  );


  /*
  --------------------------------------------------------
  CHECK OUTPUT
  --------------------------------------------------------
  */

  if(
    !dims ||
    dims.length !== 3 ||
    dims[0] !== 1 ||
    dims[2] !== 6
  ){

    throw new Error(
      "OUTPUT_SHAPE_TIDAK_DIDUKUNG: "+
      JSON.stringify(dims)
    );

  }


  /*
  --------------------------------------------------------
  DECODE
  --------------------------------------------------------
  */

  const detections =
    [];


  for(
    let i=0;
    i<dims[1];
    i++
  ){

    const o =
      i*6;


    const x1 =
      data[o];


    const y1 =
      data[o+1];


    const x2 =
      data[o+2];


    const y2 =
      data[o+3];


    const score =
      data[o+4];


    const cls =
      data[o+5];


    if(
      !Number.isFinite(score) ||
      score < CONF_THRESHOLD
    ){

      continue;

    }


    if(
      cls !== 0 &&
      cls !== 0.0
    ){

      continue;

    }


    /*
    ------------------------------------------------------
    MAP BACK
    ------------------------------------------------------
    */

    const bx1 =
      Math.max(
        0,
        (x1-padX)/scale
      );


    const by1 =
      Math.max(
        0,
        (y1-padY)/scale
      );


    const bx2 =
      Math.min(
        W,
        (x2-padX)/scale
      );


    const by2 =
      Math.min(
        H,
        (y2-padY)/scale
      );


    const bw =
      bx2-bx1;


    const bh =
      by2-by1;


    if(
      bw <= 2 ||
      bh <= 2
    ){

      continue;

    }


    detections.push({

      bbox:[
        bx1,
        by1,
        bw,
        bh
      ],

      score:
        score,

      class:
        "sample_product"

    });

  }


  return detections;

}


/*
==========================================================
SOURCE IMAGE

function source(){

    canvas.width =

      .getContext("2d")

  }


  if(
    current
  ){

  }


  throw new Error(
    "Belum ada foto"
  );

}


/*
==========================================================
CROP UNIT
==========================================================
*/

function crop(
  img,
  bbox,
  padding=0.15
){

  const [
    x,
    y,
    w,
    h
  ] = bbox;


  const W =
    img.naturalWidth ||
    img.videoWidth ||
    img.width;


  const H =
    img.naturalHeight ||
    img.videoHeight ||
    img.height;


  const x1 =
    Math.max(
      0,
      x-w*padding
    );


  const y1 =
    Math.max(
      0,
      y-h*padding
    );


  const x2 =
    Math.min(
      W,
      x+w+w*padding
    );


  const y2 =
    Math.min(
      H,
      y+h+h*padding
    );


  const c =
    document.createElement(
      "canvas"
    );


  c.width =
    Math.max(
      1,
      Math.round(x2-x1)
    );


  c.height =
    Math.max(
      1,
      Math.round(y2-y1)
    );


  c.getContext("2d")
    .drawImage(
      img,
      x1,
      y1,
      x2-x1,
      y2-y1,
      0,
      0,
      c.width,
      c.height
    );


  return c;

}


/*
==========================================================
DRAW DETECTION
==========================================================
*/

function draw(
  img,
  ds
){

  canvas.width =
    img.naturalWidth ||
    img.videoWidth ||
    img.width;


  canvas.height =
    img.naturalHeight ||
    img.videoHeight ||
    img.height;


  const c =
    canvas.getContext(
      "2d"
    );


  c.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );


  c.strokeStyle =
    "#00ff66";


  c.fillStyle =
    "#00ff66";


  c.lineWidth =
    4;


  c.font =
    "bold 22px Arial";


  ds.forEach(
    (d,i)=>{

      const [
        x,
        y,
        w,
        h
      ] = d.bbox;


      c.strokeRect(
        x,
        y,
        w,
        h
      );


      c.fillText(
        (i+1)+
        " "+
        Math.round(
          d.score*100
        )+
        "%",
        x+5,
        Math.max(
          24,
          y+24
        )
      );

    }
  );


  canvas.style.display =
    "block";


  view.style.display =
    "none";

}


/*
==========================================================
OCR PREPROCESSING
==========================================================
*/

async function preprocessOCR(
  sourceCanvas,
  mode
){

  const scale =
    3;


  const sourceW =
    sourceCanvas.width;


  const sourceH =
    sourceCanvas.height;


  const c =
    document.createElement(
      "canvas"
    );


  /*
  Jangan pakai minimum 600x600
  karena bisa mengubah rasio gambar.
  */

  c.width =
    Math.max(
      1,
      Math.round(
        sourceW*scale
      )
    );


  c.height =
    Math.max(
      1,
      Math.round(
        sourceH*scale
      )
    );


  const ctx =
    c.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.imageSmoothingEnabled =
    true;


  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(
    sourceCanvas,
    0,
    0,
    c.width,
    c.height
  );


  /*
  --------------------------------------------------------
  NORMAL
  --------------------------------------------------------
  */

  if(
    mode === "normal"
  ){

    return c;

  }


  const image =
    ctx.getImageData(
      0,
      0,
      c.width,
      c.height
    );


  const d =
    image.data;


  /*
  --------------------------------------------------------
  CONTRAST
  --------------------------------------------------------
  */

  if(
    mode === "contrast"
  ){

    for(
      let i=0;
      i<d.length;
      i+=4
    ){

      const gray =
        0.299*d[i] +
        0.587*d[i+1] +
        0.114*d[i+2];


      const value =
        Math.max(
          0,
          Math.min(
            255,
            (gray-128)*1.7+128
          )
        );


      d[i] =
        value;

      d[i+1] =
        value;

      d[i+2] =
        value;

    }

  }


  /*
  --------------------------------------------------------
  THRESHOLD
  --------------------------------------------------------
  */

  if(
    mode === "threshold"
  ){

    for(
      let i=0;
      i<d.length;
      i+=4
    ){

      const gray =
        0.299*d[i] +
        0.587*d[i+1] +
        0.114*d[i+2];


      const value =
        gray > 145
        ? 255
        : 0;


      d[i] =
        value;

      d[i+1] =
        value;

      d[i+2] =
        value;

    }

  }


  ctx.putImageData(
    image,
    0,
    0
  );


  return c;

}


/*
==========================================================
OCR
==========================================================
*/

async function ocr(
  c
){

  const modes = [
    "normal",
    "contrast",
    "threshold"
  ];


  const texts =
    [];


  for(
    let i=0;
    i<modes.length;
    i++
  ){

    const mode =
      modes[i];


    msg(
      "OCR unit... "+
      mode+
      " ("+
      (i+1)+
      "/"+
      modes.length+
      ")"
    );


    try{

      const prepared =
        await preprocessOCR(
          c,
          mode
        );


      const result =
        await Tesseract.recognize(
          prepared,
          "eng",
          {

            logger:x=>{

              if(
                x.status ===
                "recognizing text"
              ){

                msg(
                  "OCR "+
                  mode+
                  "... "+
                  Math.round(
                    (x.progress||0)*100
                  )+
                  "%"
                );

              }

            }

          }
        );


      const text =
        result.data.text ||
        "";


      console.log(
        "OCR "+mode+":",
        text
      );


      if(
        text.trim()
      ){

        texts.push(
          text
        );

      }

    }catch(e){

      console.warn(
        "OCR gagal:",
        mode,
        e
      );

    }

  }


  /*
  --------------------------------------------------------
  GABUNGKAN SEMUA HASIL
  --------------------------------------------------------
  */

  return texts.join(
    "\n"
  );

}


/*
==========================================================
CAMERA
==========================================================
*/

document.querySelector(
  "#cam"
).onclick =
async()=>{

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    video.srcObject =
      stream;


    video.style.display =
      "block";


    view.style.display =
      "none";


    msg(
      "Kamera aktif.\n"+
      "Arahkan ke produk lalu tekan Scan."
    );


  }catch(e){

    console.error(e);


    msg(
      "Kamera gagal: "+
      e.message,
      "err"
    );

  }

};


/*
==========================================================
STOP CAMERA
==========================================================
*/

document.querySelector(
  "#stop"
).onclick =
()=>{

  if(
    stream
  ){

    stream
      .getTracks()
      .forEach(
        t =>
          t.stop()
      );


    stream =
      null;

  }


  video.style.display =
    "none";

};


/*
==========================================================
UPLOAD
==========================================================
*/

document.querySelector(
  "#file"
).onchange =
e=>{

  const file =
    e.target.files[0];


  if(
    !file
  ){

    return;

  }


  const url =
    URL.createObjectURL(
      file
    );


  view.onload =
  ()=>{

    current =
      view;


    view.style.display =
      "block";


    video.style.display =
      "none";


    canvas.style.display =
      "none";


    msg(
      "Foto siap.\n"+
      "Tekan Scan."
    );

  };


  view.src =
    url;

};


/*
==========================================================
SCAN
==========================================================
*/

document.querySelector(
  "#scan"
).onclick =
async()=>{

  try{

    document.querySelector(
      "#units"
    ).innerHTML =
      "";


    document.querySelector(
      "#prod"
    ).textContent =
      "-";


    document.querySelector(
      "#size"
    ).textContent =
      "-";


    document.querySelector(
      "#count"
    ).textContent =
      "0";


    const img =
      source();


    if(
      !customModel
    ){

      throw new Error(
        "Model universal belum dimuat."
      );

    }


    msg(
      "Mendeteksi setiap unit..."
    );


    let detections =
      await detectCustom(
        img
      );


    detections =
      dedupe(
        detections
      );


    /*
    --------------------------------------------------------
    NO DETECTION
    --------------------------------------------------------
    */

    if(
      !detections.length
    ){

      msg(
        "Tidak ada unit terdeteksi.\n\n"+
        "Coba foto dengan pencahayaan lebih baik.",
        "warn"
      );

      return;

    }


    /*
    --------------------------------------------------------
    DRAW
    --------------------------------------------------------
    */

    draw(
      img,
      detections
    );


    /*
    --------------------------------------------------------
    COUNT
    --------------------------------------------------------
    */

    document.querySelector(
      "#count"
    ).textContent =
      detections.length;


    /*
    --------------------------------------------------------
    OCR
    --------------------------------------------------------
    */

    let allText =
      "";


    for(
      let i=0;
      i<detections.length;
      i++
    ){

      msg(
        "Memproses Unit "+
        (i+1)+
        " dari "+
        detections.length+
        "..."
      );


      const unitCrop =
        crop(
          img,
          detections[i].bbox,
          0.15
        );


      const text =
        await ocr(
          unitCrop
        );


      allText +=
        "\n"+
        text;


      /*
      ------------------------------------------------------
      TAMPILKAN OCR MENTAH
      ------------------------------------------------------
      */

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "unit";


      div.innerHTML =
        "<b>Unit "+
        (i+1)+
        "</b>"+
        "<br>"+
        "<small>OCR mentah:</small>"+
        "<div class='ocrraw'>"+
        (
          text.trim() ||
          "(OCR tidak terbaca)"
        )+
        "</div>";


      document.querySelector(
        "#units"
      ).appendChild(
        div
      );

    }


    console.log(
      "================================"
    );


    console.log(
      "ALL OCR TEXT:"
    );


    console.log(
      allText
    );


    console.log(
      "================================"
    );


    /*
    --------------------------------------------------------
    IDENTIFY PRODUCT
    --------------------------------------------------------
    */

    const result =
      identify(
        allText
      );


    console.log(
      "IDENTIFY RESULT:",
      result
    );


    if(
      result.product
    ){

      const product =
        result.product;


      const size =
        sizeOf(
          allText,
          product
        );


      document.querySelector(
        "#prod"
      ).textContent =
        product.name;


      document.querySelector(
        "#size"
      ).textContent =
        size;


      msg(
        "SELESAI\n\n"+
        "Produk: "+
        product.name+
        "\n"+
        "Size: "+
        size+
        "\n"+
        "Jumlah: "+
        detections.length+
        " unit",
        "ok"
      );


    }else{

      const size =
        sizeOf(
          allText,
          null
        );


      document.querySelector(
        "#size"
      ).textContent =
        size;


      msg(
        "Jumlah: "+
        detections.length+
        " unit.\n"+
        "OCR selesai tetapi produk belum ada "+
        "di Product Master.",
        "warn"
      );

    }


  }catch(e){

    console.error(
      "SCAN ERROR:",
      e
    );


    msg(
      "SCAN GAGAL\n\n"+
      e.message,
      "err"
    );

  }

};


/*
==========================================================
LOAD ONNX MODEL
==========================================================
*/

(async()=>{

  try{

    /*
    ------------------------------------------------------
    STEP 1
    ------------------------------------------------------
    */

    if(
      !window.ort
    ){

      throw new Error(
        "ONNX Runtime Web tidak termuat dari CDN."
      );

    }


    console.log(
      "ONNX Runtime:",
      ort.version
    );


    /*
    ------------------------------------------------------
    STEP 2
    ------------------------------------------------------
    */

    ort.env.wasm.numThreads =
      1;


    ort.env.wasm.simd =
      true;


    ort.env.wasm.wasmPaths =
      "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";


    /*
    ------------------------------------------------------
    STEP 3
    ------------------------------------------------------
    */

    msg(
      "Memeriksa file model..."
    );


    console.log(
      "MODEL URL:",
      CUSTOM_MODEL_URL
    );


    let response;


    try{

      response =
        await fetch(
          CUSTOM_MODEL_URL,
          {
            method:"HEAD",
            cache:"no-store"
          }
        );

    }catch(fetchError){

      throw new Error(
        "File model tidak bisa diakses.\n"+
        "URL: "+
        CUSTOM_MODEL_URL+
        "\n"+
        "Fetch error: "+
        fetchError.message
      );

    }


    console.log(
      "MODEL HTTP STATUS:",
      response.status
    );


    if(
      !response.ok
    ){

      throw new Error(
        "Model tidak ditemukan.\n"+
        "HTTP Status: "+
        response.status+
        "\n"+
        "URL: "+
        CUSTOM_MODEL_URL
      );

    }


    /*
    ------------------------------------------------------
    MODEL FOUND
    ------------------------------------------------------
    */

    msg(
      "File model ditemukan.\n"+
      "Memuat ONNX..."
    );


    /*
    ------------------------------------------------------
    LOAD ONNX
    ------------------------------------------------------
    */

    customModel =
      await ort.InferenceSession.create(
        CUSTOM_MODEL_URL,
        {

          executionProviders:[
            "wasm"
          ],

          graphOptimizationLevel:
            "all"

        }
      );


    /*
    ------------------------------------------------------
    DEBUG
    ------------------------------------------------------
    */

    console.log(
      "================================"
    );


    console.log(
      "MODEL BERHASIL DIMUAT"
    );


    console.log(
      "INPUT NAMES:",
      customModel.inputNames
    );


    console.log(
      "OUTPUT NAMES:",
      customModel.outputNames
    );


    console.log(
      "================================"
    );


    /*
    ------------------------------------------------------
    READY
    ------------------------------------------------------
    */

    msg(
      "MODEL SIAP ✅\n\n"+
      "Universal sample_product\n"+
      "Siap melakukan deteksi.",
      "ok"
    );


  }catch(e){

    console.error(
      "================================"
    );


    console.error(
      "ONNX LOAD ERROR"
    );


    console.error(
      e
    );


    console.error(
      "================================"
    );


    const detail =
      e && e.message
      ? e.message
      : String(e);


    msg(
      "MODEL GAGAL DIMUAT ❌\n\n"+
      "URL MODEL:\n"+
      CUSTOM_MODEL_URL+
      "\n\n"+
      "ERROR:\n"+
      detail+
      "\n\n"+
      "Buka Console browser jika perlu.",
      "err"
    );

  }

})();

</script>
